<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Unreal .level Editor</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        label, input, select, button { display: block; margin-bottom: 1rem; }
    </style>
</head>
<body>
<h1>Unreal .level Editor</h1>
<input type="file" id="fileInput" accept=".level" />
<div id="controls" style="display:none;">
    <div>
        <label>Fog Density:</label>
        <input type="number" step="0.0001" id="fogDensity" />
        <button id="updateFogBtn">Set Fog</button>
    </div>
    <div>
        <label>Music:</label>
        <select id="levelMusic">
            <option>Rome</option>
            <option>Medieval</option>
            <option>Egypt</option>
            <option>Wood</option>
        </select>
        <button id="updateMusicBtn">Set Music</button>
    </div>
    <div>
        <label>Terrain:</label>
        <select id="terrainSelect">
            <option>Rome</option>
            <option>Medieval</option>
            <option>Egypt</option>
            <option>Wood</option>
        </select>
        <button id="updateTerrainBtn">Set Terrain</button>
    </div>
    <div>
        <label>Vegetation:</label>
        <select id="vegSelect">
            <option>Rome</option>
            <option>Medieval</option>
            <option>Egypt</option>
            <option>Wood</option>
        </select>
        <button id="updateVegBtn">Set Vegetation</button>
    </div>
    <button id="downloadAllBtn">Download</button>
</div>

<script type="module" src="UnrealEngineFile.js"></script>
<script type="module" src="LevelFile.js"></script>
<script type="module" src="index.js"></script>
</body>
</html>
